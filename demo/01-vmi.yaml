# Demo VM (wrapping a VMI with one Kube-OVN secondary NIC attached via DRA +
# this binding plugin, instead of Multus) — KubeVirt creates and owns the
# actual VMI from spec.template, so nothing here talks to the driver/sidecar
# any differently than a bare VMI would.
#
# spec.template.spec.resourceClaims[].name ("kubeovn0-claim") is an internal
# VMI-scoped handle; spec.template.spec.networks[].resourceClaim.claimName
# references it (validated by kubevirt's admission — see
# pkg/network/admitter/dra.go validateDRANetworkClaimReference). requestName
# ("nic0") must match the request name in 00-resourceclaimtemplate.yaml.
#
# spec.template.spec.domain.devices.interfaces[].binding.name ("kube-ovn-nic")
# must match the key registered in manifests/kubevirt-binding-config.yaml.
# Per validateDRANetworkInterfaceBinding, a DRA network's interface must be
# SRIOV or have Binding set — Binding is satisfied here.
#
# The primary interface uses "bridge" binding (KubeVirt's
# PermitBridgeInterfaceOnPodNetwork defaults to true). Kube-OVN has
# first-class, documented support for this, including live migration via the
# kubevirt.io/allow-pod-bridge-network-live-migration annotation below — see
# https://kubeovn.github.io/docs/v1.15.x/en/kubevirt/live-migration/.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kube-ovn-dra-vmi
  namespace: default
spec:
  # VirtualMachine wraps the VMI in KubeVirt's standard lifecycle object:
  # `kubectl get vm`, `virtctl start/stop/restart`, and automatic
  # recreation if the VMI is ever deleted out from under it. Everything
  # below spec.template.spec is byte-for-byte the same VMI spec this file
  # used to define directly — KubeVirt generates the identical VMI from
  # this template, so the resourceClaims/networks/domain/volumes contract
  # with the driver and this plugin's sidecar is completely unaffected.
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        # Whether THIS network should carry the pod's default route is
        # VMI-topology knowledge only the VMI author has — neither
        # kube-ovn-controller nor this binding plugin's sidecar guesses it, so it
        # belongs here, not hardcoded into their code. KubeVirt propagates VMI
        # metadata.annotations onto the generated virt-launcher pod (same
        # mechanism as the live-migration annotation above), so this becomes a
        # plain pod annotation any consumer (present or future) can read
        # directly, in the exact key kube-ovn's own daemon/handler.go already
        # uses for regular CNI-attached pods (see
        # util.DefaultRouteAnnotationTemplate). "false" here is also already the
        # driver's own unconditional behavior for secondary NICs
        # (configurePodIface refuses to install a default route on them
        # regardless), so this is documentation of that fact, not new behavior.
        ovn-subnet.default.ovn.kubernetes.io/default_route: "false"
    spec:
      resourceClaims:
        - name: kubeovn0-claim
          resourceClaimTemplateName: kubeovn0-claim-template
      networks:
        - name: default
          pod: {}
        - name: kubeovn0
          resourceClaim:
            claimName: kubeovn0-claim
            requestName: nic0
      domain:
        devices:
          interfaces:
            - name: default
              bridge: {}
            - name: kubeovn0
              binding:
                name: kube-ovn-nic
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          requests:
            memory: 1Gi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            # Real cloud-init (unlike Cirros's minimal datasource) applies a
            # top-level ssh_authorized_keys to the distro's default user, which
            # for this official Ubuntu containerdisk is "ubuntu".
            # Login: ssh ubuntu@<vmi-ip>.
            userData: |-
              #cloud-config
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
              ssh_authorized_keys:
                - ssh-rsa  soer3n@soer3n
            # Both NICs get a same-metric default route via DHCP — ovn-subnet
            # still advertises a gateway despite the default_route:false
            # annotation above — so the guest kernel ECMP-hashes egress traffic
            # across both, silently dropping whatever lands on enp2s0. Dropping
            # enp2s0's route here makes routing deterministic and keeps enp1s0
            # (ovn-default, NAT=true) as the sole default route.
            #
            # Earlier this file instead dropped enp1s0's route, leaving
            # ovn-subnet's gateway as the only default route — that was reverted:
            # even with natOutgoing enabled on ovn-subnet afterward (and the
            # per-node NAT ipset correctly updated), egress ICMP from the guest
            # never reached the node's physical uplink at all — confirmed via
            # tcpdump on eth0 during a live ping, which captured nothing for that
            # traffic. The drop happens inside OVN's logical pipeline
            # (br-int flows / distributed gateway port), below the iptables
            # MASQUERADE rule that was verified correctly configured. ovn-subnet
            # is a demo-only subnet that was never wired for real external
            # egress, unlike ovn-default (confirmed working, 0% loss) — so
            # enp1s0 must stay the default route.
            #
            # enp1s0/enp2s0 naming is deterministic: KubeVirt assigns PCI slots
            # by domain.devices.interfaces list order, so "default" (declared
            # first) is always enp1s0 and "kubeovn0" (declared second) is always
            # enp2s0 — no need to match dynamically by wildcard.
            networkData: |-
              version: 2
              ethernets:
                enp1s0:
                  dhcp4: true
                enp2s0:
                  dhcp4: true
                  dhcp4-overrides:
                    use-routes: false
