# Demo VMI with one Kube-OVN secondary NIC attached via DRA + this binding
# plugin, instead of Multus.
#
# spec.resourceClaims[].name ("kubeovn0-claim") is an internal VMI-scoped
# handle; spec.networks[].resourceClaim.claimName references it (validated by
# kubevirt's admission — see pkg/network/admitter/dra.go
# validateDRANetworkClaimReference). requestName ("nic0") must match the
# request name in 00-resourceclaimtemplate.yaml.
#
# domain.devices.interfaces[].binding.name ("kube-ovn-nic") must match the key
# registered in manifests/kubevirt-binding-config.yaml. Per
# validateDRANetworkInterfaceBinding, a DRA network's interface must be SRIOV
# or have Binding set — Binding is satisfied here.
#
# The primary interface uses "bridge" binding (KubeVirt's
# PermitBridgeInterfaceOnPodNetwork defaults to true). Kube-OVN has
# first-class, documented support for this, including live migration via the
# kubevirt.io/allow-pod-bridge-network-live-migration annotation below — see
# https://kubeovn.github.io/docs/v1.15.x/en/kubevirt/live-migration/.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: kube-ovn-dra-vmi
  namespace: default
  annotations:
    kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    # Whether THIS network should carry the pod's default route is
    # VMI-topology knowledge only the VMI author has — neither
    # kube-ovn-controller nor this binding plugin's sidecar guesses it, so it
    # belongs here, not hardcoded into their code. KubeVirt propagates VMI
    # metadata.annotations onto the generated virt-launcher pod (same
    # mechanism as the live-migration annotation above), so this becomes a
    # plain pod annotation any consumer (present or future) can read
    # directly, in the exact key kube-ovn's own daemon/handler.go already
    # uses for regular CNI-attached pods (see
    # util.DefaultRouteAnnotationTemplate). "false" here is also already the
    # driver's own unconditional behavior for secondary NICs
    # (configurePodIface refuses to install a default route on them
    # regardless), so this is documentation of that fact, not new behavior.
    ovn-subnet.default.ovn.kubernetes.io/default_route: "false"
spec:
  resourceClaims:
    - name: kubeovn0-claim
      resourceClaimTemplateName: kubeovn0-claim-template
  networks:
    - name: default
      pod: {}
    - name: kubeovn0
      resourceClaim:
        claimName: kubeovn0-claim
        requestName: nic0
  domain:
    devices:
      interfaces:
        - name: default
          bridge: {}
        - name: kubeovn0
          binding:
            name: kube-ovn-nic
      disks:
        - name: containerdisk
          disk:
            bus: virtio
        - name: cloudinitdisk
          disk:
            bus: virtio
    resources:
      requests:
        memory: 1Gi
  terminationGracePeriodSeconds: 30
  volumes:
    - name: containerdisk
      containerDisk:
        image: quay.io/containerdisks/ubuntu:22.04
    - name: cloudinitdisk
      cloudInitNoCloud:
        # Real cloud-init (unlike Cirros's minimal datasource) applies a
        # top-level ssh_authorized_keys to the distro's default user, which
        # for this official Ubuntu containerdisk is "ubuntu".
        # Login: ssh ubuntu@<vmi-ip>.
        userData: |-
          #cloud-config
          packages:
            - qemu-guest-agent
          runcmd:
            - systemctl enable --now qemu-guest-agent
          ssh_authorized_keys:
            - ssh-rsa  soer3n@soer3n
        # kubeovn0's IP is dynamically IPAM-allocated per claim instance, so it
        # can't be hardcoded here — match by wildcard interface name instead
        # and let kube-ovn's OVN DHCP server (enabled on ovn-subnet) hand out
        # whatever IP it already reserved for this logical switch port.
        networkData: |-
          version: 2
          ethernets:
            all-en:
              match:
                name: "en*"
              dhcp4: true
