# Comparison VMI: same ovn-subnet, but the secondary NIC is attached via
# Multus + KubeVirt's built-in "bridge" binding (real managedTap code path)
# instead of our DRA + sidecar binding plugin. Used to isolate whether the
# guest-DHCP failure on the DRA-attached secondary NIC is caused by our
# sidecar/driver wiring or by something generic (OVN pipeline, subnet DHCP
# config, netns behavior) that would affect ANY secondary NIC on this subnet.
#
# The NetworkAttachmentDefinition "ovn-subnet" (see ../demo/nad-ovn-subnet.yaml
# equivalent applied ad hoc) uses kube-ovn's CNI plugin with
# provider: "ovn-subnet.default.ovn", matching the existing Subnet's
# spec.provider so this attaches to the exact same logical switch/DHCP config
# as the DRA demo.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: kube-ovn-multus-vmi
  namespace: default
  annotations:
    kubevirt.io/allow-pod-bridge-network-live-migration: "true"
spec:
  networks:
    - name: default
      pod: {}
    - name: kubeovn0
      multus:
        networkName: ovn-subnet
  domain:
    devices:
      interfaces:
        - name: default
          bridge: {}
        - name: kubeovn0
          bridge: {}
      disks:
        - name: containerdisk
          disk:
            bus: virtio
        - name: cloudinitdisk
          disk:
            bus: virtio
    resources:
      requests:
        memory: 1Gi
  terminationGracePeriodSeconds: 30
  volumes:
    - name: containerdisk
      containerDisk:
        image: quay.io/containerdisks/ubuntu:22.04
    - name: cloudinitdisk
      cloudInitNoCloud:
        userData: |-
          #cloud-config
          packages:
            - qemu-guest-agent
          runcmd:
            - systemctl enable --now qemu-guest-agent
          ssh_authorized_keys:
            - ssh-rsa  soer3n@soer3n
        networkData: |-
          version: 2
          ethernets:
            all-en:
              match:
                name: "en*"
              dhcp4: true
