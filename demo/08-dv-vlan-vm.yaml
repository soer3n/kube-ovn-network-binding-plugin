# Demo VM with a persistent root disk (CDI DataVolume) and a secondary NIC on
# kube-ovn's VLAN underlay subnet (vlan100-subnet), attached via DRA + this
# binding plugin. Same network setup as 04-vlan-vmi.yaml, but the guest
# survives restarts: disk contents, SSH host keys and, through kube-ovn's
# keep-vm-ip, the IP and MAC of the DRA NIC stay the same across stop/start.
#
# Requires CDI (containerized-data-importer) and a default StorageClass. On
# kind's local-path (RWO) the VM cannot live-migrate; use the containerDisk
# demos for migration.
#
# Reuses 03-vlan-resourceclaimtemplate.yaml: the VMI network is named
# "vlan100", so domain.PodInterfaceName("vlan100") matches the template's
# NicConfig.interfaceName. Each VM still gets its own generated claim.
#
#   ssh ubuntu@172.23.0.<x>
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kube-ovn-dv-vm
  namespace: default
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: kube-ovn-dv-vm-rootdisk
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/ubuntu:22.04
        storage:
          # kind's local-path StorageProfile has no access modes, so set one
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
  template:
    metadata:
      annotations:
        external.vlan100-subnet.ovn.kubernetes.io/default_route: "false"
    spec:
      resourceClaims:
        - name: vlan100-claim
          resourceClaimTemplateName: vlan100-claim-template
      networks:
        - name: default
          pod: {}
        - name: vlan100
          resourceClaim:
            claimName: vlan100-claim
            requestName: nic0
      domain:
        devices:
          interfaces:
            - name: default
              bridge: {}
            - name: vlan100
              binding:
                name: kube-ovn-nic
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          requests:
            memory: 1Gi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: kube-ovn-dv-vm-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
              ssh_authorized_keys:
                - ssh-rsa  soer3n@soer3n
            # Keep enp1s0 (ovn-default, NAT'd egress) as the only default
            # route, same as 04-vlan-vmi.yaml; the VLAN subnet is on-link.
            networkData: |-
              version: 2
              ethernets:
                enp1s0:
                  dhcp4: true
                enp2s0:
                  dhcp4: true
                  dhcp4-overrides:
                    use-routes: false
