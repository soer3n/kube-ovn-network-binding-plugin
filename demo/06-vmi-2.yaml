# Second VM (wrapping a VMI) on the same OVN overlay subnet as 01-vmi.yaml,
# for verifying VMI-to-VMI connectivity over the DRA-attached secondary NIC
# (east-west), not just north-south egress from a single VMI. See 01-vmi.yaml
# for the full rationale on every field below — this file only calls out
# what's specific to being the second instance.
#
# The ResourceClaimTemplate is SHARED with 01-vmi.yaml's VM, not duplicated:
# NicConfig.interfaceName is a pure function of the VMI network's NAME
# ("kubeovn0"), not of the VMI itself (see 00-resourceclaimtemplate.yaml), so
# both VMIs reusing the network name "kubeovn0" correctly reuse
# kubeovn0-claim-template — each still gets its own ResourceClaim instance
# generated from it, and its own IPAM-allocated IP on ovn-subnet.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kube-ovn-dra-vmi-2
  namespace: default
spec:
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        ovn-subnet.default.ovn.kubernetes.io/default_route: "false"
    spec:
      resourceClaims:
        - name: kubeovn0-claim
          resourceClaimTemplateName: kubeovn0-claim-template
      networks:
        - name: default
          pod: {}
        - name: kubeovn0
          resourceClaim:
            claimName: kubeovn0-claim
            requestName: nic0
      domain:
        devices:
          interfaces:
            - name: default
              bridge: {}
            - name: kubeovn0
              binding:
                name: kube-ovn-nic
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          requests:
            memory: 1Gi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
              ssh_authorized_keys:
                - ssh-rsa  soer3n@soer3n
            # Same default-route handling as 01-vmi.yaml: keep enp1s0
            # (ovn-default) as the sole default route, drop it on enp2s0
            # (ovn-subnet) to avoid the duplicate-default-route ECMP issue.
            networkData: |-
              version: 2
              ethernets:
                enp1s0:
                  dhcp4: true
                enp2s0:
                  dhcp4: true
                  dhcp4-overrides:
                    use-routes: false
