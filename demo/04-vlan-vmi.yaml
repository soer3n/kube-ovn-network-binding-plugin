# Demo VM (wrapping a VMI) with a secondary NIC on kube-ovn's VLAN UNDERLAY
# subnet (vlan100-subnet, 172.23.0.0/24, tagged vlan100 on the "external"
# ProviderNetwork's eth1 uplink), attached via DRA + this binding plugin —
# the underlay counterpart to 01-vmi.yaml's OVN overlay demo. KubeVirt
# creates and owns the actual VMI from spec.template.
#
# The NIC's port sits on the VLAN subnet's logical switch, whose localnet port
# bridges it to br-external and the node's eth1 trunk with tag 100. The FRR
# gateway has a matching 802.1q sub-interface on that trunk (eth1.100,
# 172.23.0.253/24) and routes the subnet to the host, so once the guest gets
# its DHCP-assigned 172.23.0.x address, it is reachable from the host by IP
# without NAT:
#
#   ssh ubuntu@172.23.0.<x>
#
# See 03-vlan-resourceclaimtemplate.yaml for the ResourceClaimTemplate and
# the interfaceName naming-contract explanation.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kube-ovn-vlan-vmi
  namespace: default
spec:
  # See 01-vmi.yaml's spec comment for why this is a VirtualMachine wrapping
  # the VMI rather than a bare VMI — spec.template.spec below is unchanged
  # from what this file used to define directly.
  runStrategy: Always
  template:
    metadata:
      annotations:
        kubevirt.io/allow-pod-bridge-network-live-migration: "true"
        # See the equivalent annotation in 01-vmi.yaml for why this is declared
        # here rather than assumed by kube-ovn-controller or the sidecar.
        external.vlan100-subnet.ovn.kubernetes.io/default_route: "false"
    spec:
      resourceClaims:
        - name: vlan100-claim
          resourceClaimTemplateName: vlan100-claim-template
      networks:
        - name: default
          pod: {}
        - name: vlan100
          resourceClaim:
            claimName: vlan100-claim
            requestName: nic0
      domain:
        devices:
          interfaces:
            - name: default
              bridge: {}
            - name: vlan100
              binding:
                name: kube-ovn-nic
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
        resources:
          requests:
            memory: 1Gi
      terminationGracePeriodSeconds: 30
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:22.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              packages:
                - qemu-guest-agent
              runcmd:
                - systemctl enable --now qemu-guest-agent
              ssh_authorized_keys:
                - ssh-rsa  soer3n@soer3n
            # Same duplicate-default-route issue as 01-vmi.yaml: both NICs get a
            # same-metric DHCP default route despite the default_route:false
            # annotation above, so the guest ECMP-hashes egress across both and
            # silently drops whatever lands on the "losing" NIC. Dropping
            # enp2s0's route here keeps enp1s0 (ovn-default, confirmed working
            # NAT'd egress) as the sole default route — matching 01-vmi.yaml's
            # final choice after ovn-subnet's own NAT'd egress turned out to be
            # broken inside OVN's pipeline even with natOutgoing enabled (see
            # that file's comment). vlan100-subnet's direct host reachability
            # (this file's header comment) doesn't depend on a default route at
            # all — it's on-link — so this only affects any OTHER egress traffic
            # the guest sends. enp1s0/enp2s0 naming is deterministic per
            # KubeVirt's PCI-slot-by-interface-list-order behavior (see
            # 01-vmi.yaml).
            networkData: |-
              version: 2
              ethernets:
                enp1s0:
                  dhcp4: true
                enp2s0:
                  dhcp4: true
                  dhcp4-overrides:
                    use-routes: false
