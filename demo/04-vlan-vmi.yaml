# Demo VMI with a secondary NIC on kube-ovn's VLAN UNDERLAY subnet
# (vlan100-subnet, 172.23.0.0/24, tagged vlan100 on the "external"
# ProviderNetwork's eth1 uplink), attached via DRA + this binding plugin —
# the underlay counterpart to 01-vmi.yaml's OVN overlay demo.
#
# Unlike the overlay case, this NIC's traffic never touches br-int/OVN
# routing at all: the driver's host veth lands directly on br-external as an
# access port tagged vlan100, egressing the node's physical eth1 trunk. The
# HOST itself has a matching 802.1q sub-interface on that trunk
# (eth1.100, 172.23.0.253/24), so once the guest gets its DHCP-assigned
# 172.23.0.x address, it is reachable directly from the host by IP — no NAT,
# no OVN hop:
#
#   ssh ubuntu@172.23.0.<x>
#
# See 03-vlan-resourceclaimtemplate.yaml for the ResourceClaimTemplate and
# the interfaceName naming-contract explanation.
---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: kube-ovn-vlan-vmi
  namespace: default
  annotations:
    kubevirt.io/allow-pod-bridge-network-live-migration: "true"
    # See the equivalent annotation in 01-vmi.yaml for why this is declared
    # here rather than assumed by kube-ovn-controller or the sidecar.
    external.vlan100-subnet.ovn.kubernetes.io/default_route: "false"
spec:
  resourceClaims:
    - name: vlan100-claim
      resourceClaimTemplateName: vlan100-claim-template
  networks:
    - name: default
      pod: {}
    - name: vlan100
      resourceClaim:
        claimName: vlan100-claim
        requestName: nic0
  domain:
    devices:
      interfaces:
        - name: default
          bridge: {}
        - name: vlan100
          binding:
            name: kube-ovn-nic
      disks:
        - name: containerdisk
          disk:
            bus: virtio
        - name: cloudinitdisk
          disk:
            bus: virtio
    resources:
      requests:
        memory: 1Gi
  terminationGracePeriodSeconds: 30
  volumes:
    - name: containerdisk
      containerDisk:
        image: quay.io/containerdisks/ubuntu:22.04
    - name: cloudinitdisk
      cloudInitNoCloud:
        userData: |-
          #cloud-config
          packages:
            - qemu-guest-agent
          runcmd:
            - systemctl enable --now qemu-guest-agent
          ssh_authorized_keys:
            - ssh-rsa  soer3n@soer3n
        networkData: |-
          version: 2
          ethernets:
            all-en:
              match:
                name: "en*"
              dhcp4: true
