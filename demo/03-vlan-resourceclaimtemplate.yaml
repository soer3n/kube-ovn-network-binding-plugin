# ResourceClaimTemplate for a VMI network named "vlan100" (see
# 04-vlan-vmi.yaml), requesting a NIC on kube-ovn's VLAN underlay subnet
# "vlan100-subnet" (172.23.0.0/24, tagged vlan100 on the "external"
# ProviderNetwork's eth1 uplink) instead of the OVN overlay subnet used by
# 00-resourceclaimtemplate.yaml.
#
# kube-ovn-controller creates the NIC's logical switch port on the VLAN
# subnet's logical switch, and the driver plugs the NIC into br-int like an
# overlay NIC. OVN forwards its traffic through the subnet's localnet port to
# the provider bridge (br-external), tagged with vlan100, onto the shared
# trunk. The FRR gateway has a matching 802.1q sub-interface (eth1.100,
# 172.23.0.253/24) on that trunk, so a VM's secondary NIC on this subnet is
# reachable by IP without NAT.
#
# Same naming contract as 00-resourceclaimtemplate.yaml: interfaceName must
# equal domain.PodInterfaceName("vlan100") from this repo's sidecar, computed
# via the same one-liner documented there. -> nic1dba2326
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: vlan100-claim-template
  namespace: default
spec:
  spec:
    devices:
      requests:
        - name: nic0
          exactly:
            deviceClassName: nic.kubeovn.io
            selectors:
              - cel:
                  expression: "device.attributes['nic.kubeovn.io'].subnetName == 'vlan100-subnet'"
            count: 1
      config:
        - requests: ["nic0"]
          opaque:
            driver: nic.kubeovn.io
            parameters:
              apiVersion: nic.resource.kube-ovn.io/v1alpha1
              kind: NicConfig
              interfaceName: nic1dba2326
