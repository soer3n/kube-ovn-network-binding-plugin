# Registers this plugin as a KubeVirt network binding. No domainAttachmentType
# is set (pure sidecar mode): KubeVirt's core domain configurator skips
# plugin-bound interfaces entirely
# (pkg/virt-launcher/virtwrap/converter/network/configurator.go), leaving
# 100% of the domain XML construction to this sidecar's OnDefineDomain hook.
#
# This deliberately does NOT use domainAttachmentType: managedTap — as of
# KubeVirt v1.9.0 and v1.10.0-alpha.0, KubeVirt's built-in managedTap
# attachment cannot resolve a pod interface name for a DRA (resourceClaim)
# network, because pkg/network/namescheme only handles Multus networks.
#
# Apply with: kubectl patch kubevirt kubevirt -n kubevirt --type merge --patch-file manifests/kubevirt-binding-config.yaml
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - NetworkDevicesWithDRA
    network:
      binding:
        kube-ovn-nic:
          sidecarImage: ghcr.io/soer3n/kube-ovn-network-binding-plugin:dev
